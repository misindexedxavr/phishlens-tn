<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PhishLens TN | Phishing page analyzer for Tunisian brands{% endblock %}</title>
  <meta name="description" content="Analyze a suspicious link without opening it. PhishLens TN inspects forms, domains, certificates, redirects and brand look-alikes for Tunisian banks, telecoms, the post office and payment services.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="{{ url_for('index') }}" aria-label="PhishLens TN, home">
        <svg class="brand__mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" focusable="false">
          <circle cx="14" cy="14" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/>
          <path d="M21 21l7 7" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
          <path d="M10 14.2l2.7 2.7L18.4 11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand__name">PhishLens <span class="brand__tn">TN</span></span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="{{ url_for('about') }}">How scoring works</a>
        <button type="button" class="icon-btn" id="theme-toggle" aria-pressed="false" aria-label="Use light theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <div class="safety" role="note">
    <div class="wrap safety__inner">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
      <p><strong>Analyze only.</strong> Never open suspicious links in your normal browser.</p>
    </div>
  </div>

  <main id="main" class="wrap" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p class="built-by">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span class="built-by__text">Built by Xavyr</span>
      <span class="built-by__year">&copy; {{ year }}</span>
    </p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
